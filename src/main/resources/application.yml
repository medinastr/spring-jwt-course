server:
  port: 8181
  servlet:
    context-path: /api/v1
    session:
      timeout: ${SESSION_TIMEOUT:20m}

spring:
  security:
    user:
      name: medinastr
      password: medinastr
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      show-sql: true
  jwt:
    secret: ${JWT_SECRET:jetYmfACxddAuexPznq1z5ui9sP6ibIER7vaFO9I4mY=}
    expiration: ${JWT_EXPIRATION:3600000} # 1 hour in milliseconds

logging:
  level:
    org:
      springframework:
        security: TRACE
      hibernate:
        SQL: DEBUG
        type:
          descriptor:
            sql:
              BasicBinder: TRACE
      flywaydb: DEBUG